name: Deploy touski to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Verify Build
        run: ls -la dist

      - name: Fail if a credential reached the static bundle
        run: |
          # Anything under dist/ is public. Never publish an API key or a VITE_ secret reference.
          # The UI legitimately mentions the "sk-ant-" prefix, so match key-shaped literals only.
          # Explicit if/exit: a bare `! grep` never aborts a step under bash -e.
          if grep -rnE "sk-ant-[A-Za-z0-9_-]{20,}" dist/; then echo "::error::key-shaped literal in dist/"; exit 1; fi
          if grep -rn "VITE_ANTHROPIC" dist/; then echo "::error::VITE_ANTHROPIC reference in dist/"; exit 1; fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
